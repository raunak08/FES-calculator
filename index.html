<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FES Calculator</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --border:#e5e7ef; --muted:#646b7a; --ink:#0f172a;
      --accent:#0d6efd; --inset:#fafbff;
      /* department blocks */
      --retail:#fff8e1;   /* light yellow */
      --lab:#e1f5fe;      /* light blue */
      --doctor:#e8f5e9;   /* light green */
      --other:#f3e5f5;    /* light lavender */
    }
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:980px;margin:28px auto;padding:20px}
    h1{margin:0 0 10px 0;font-size:22px}
    .muted{color:var(--muted);font-size:12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
    label{font-size:12px;color:#334155;display:block;margin:0 0 6px}
    input,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:14px;background:#fff}
    input[type="number"]{text-align:right}
    .row{display:flex;gap:10px;align-items:center;margin-top:12px}
    .btn{border:0;border-radius:10px;padding:9px 12px;cursor:pointer}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-ghost{background:#eef3ff;color:#1e293b}
    .out{font-size:1.2rem;font-weight:700}

    .sectionTitle{font-size:1.2rem;font-weight:700;margin:20px 0 6px;border-left:5px solid #000;padding-left:6px}
    .block{border:1px solid var(--border);border-radius:12px;padding:12px}
    .retail{background:var(--retail)}
    .lab{background:var(--lab)}
    .doctor{background:var(--doctor)}
    .other{background:var(--other)}

    .totalWrap{margin-top:16px}
    .totalRow{border-top:3px solid #000;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
    .totalRow label{font-weight:800;margin-bottom:6px}

    /* disabled style */
    .disabled input{background:#e0e0e0 !important}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>FES Calculator</h1>
    <div class="muted">All calculations run in your browser. No backend.</div>

    <!-- Top controls -->
    <div class="grid" style="margin-top:12px">
      <div class="card">
        <label>OD Type</label>
        <select id="odType">
          <option value="">-- Select OD Type --</option>
          <option value="EMP">Employed / EECA / MACYS PR</option>
          <option value="SUB">Sub lease / LRFT No SS / Macys</option>
          <option value="LRFTU">LRFT Universal / LRFT Friendly PC</option>
        </select>
      </div>
      <div class="card">
        <label>Lab % <span class="muted">(derive from = Total Lab Plan Hours ÷ Total Retail Plan Hours from Earned Hours or Hours Planner)</span></label>
        <input id="labPct" type="number" step="0.01" placeholder="e.g. 15.00" inputmode="decimal" />
      </div>
    </div>

    <!-- RETAIL -->
    <h2 class="sectionTitle">Retail</h2>
    <div class="block retail">
      <div class="grid">
        <div class="card"><label>Retail Hours of Operation</label><input id="retailHOO" type="number" inputmode="decimal" /></div>
        <div class="card"><label>Gross Units Sold</label><input id="grossUnits" type="number" inputmode="decimal" /></div>
        <div class="card"><label>Earned Retail Hours<br><span class="muted">max(Retail×1.5, Retail + 1 + Units×0.75)</span></label><div id="earnedRetail" class="out">—</div></div>
      </div>
    </div>

    <!-- LAB -->
    <h2 class="sectionTitle">Lab</h2>
    <div class="block lab">
      <div class="grid">
        <div class="card"><label>Earned Lab Hours <span class="muted">(Earned Retail × Lab%)</span></label><div id="earnedLab" class="out">—</div></div>
      </div>
    </div>

    <!-- DOCTOR -->
    <h2 class="sectionTitle">Doctor</h2>
    <div id="doctorBlock" class="block doctor">
      <div class="grid">
        <div class="card"><label>Doctor Hours of Operation</label><input id="doctorHours" type="number" inputmode="decimal" /></div>
        <div class="card"><label>Exams</label><input id="exams" type="number" inputmode="decimal" /></div>
        <div class="card"><label>OD Aligned Hours <span class="muted">(LRFT Universal / Friendly PC only)</span></label><input id="odAlignedHours" type="number" inputmode="decimal" /></div>
        <div class="card"><label>Earned Patient Care Hours<br><span class="muted">EMP: max(Doc, Exams×0.6) · SUB: 0 · LRFTU: OD Aligned</span></label><div id="earnedPC" class="out">—</div></div>
      </div>
    </div>

    <!-- OTHER -->
    <h2 class="sectionTitle">Other Hours</h2>
    <div class="block other">
      <div class="grid">
        <div class="card"><label>Other Hours / Earmarks</label><input id="otherHours" type="number" inputmode="decimal" /></div>
      </div>
    </div>

    <!-- TOTAL -->
    <div class="totalWrap">
      <div class="totalRow">
        <label>Earned Total: All Depts</label>
        <div id="earnedTotal" class="out">—</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="row">
      <button class="btn btn-primary" id="calcBtn">Recalculate</button>
      <button class="btn btn-ghost" id="resetBtn">Reset</button>
      <span id="status" class="muted"></span>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const num = v => parseFloat(v) || 0;
    const fmt = v => Number.isFinite(v) ? v.toFixed(2) : "—";

    function recalc(){
      const retail = num($("retailHOO").value);
      const units  = num($("grossUnits").value);
      const labPct = num($("labPct").value) / 100;
      const doctor = num($("doctorHours").value);
      const exams  = num($("exams").value);
      const od     = num($("odAlignedHours").value);
      const other  = num($("otherHours").value);
      const odType = $("odType").value;

      // Earned Retail = max(Retail*1.5, Retail + 1 + Units*0.75)
      const earnedRetail = Math.max(retail * 1.5, retail + 1 + units * 0.75);
      // Earned Lab = Earned Retail * Lab%
      const earnedLab = earnedRetail * labPct;

      // Earned Patient Care by OD Type
      let earnedPC = 0;
      if (odType === "EMP") {
        earnedPC = Math.max(doctor, exams * 0.6);
      } else if (odType === "SUB") {
        earnedPC = 0;
      } else if (odType === "LRFTU") {
        earnedPC = od;
      }

      // Total
      const earnedTotal = earnedRetail + earnedLab + earnedPC + other;

      // Outputs
      $("earnedRetail").textContent = fmt(earnedRetail);
      $("earnedLab").textContent    = fmt(earnedLab);
      $("earnedPC").textContent     = fmt(earnedPC);
      $("earnedTotal").textContent  = fmt(earnedTotal);
    }

    // Enable/disable inputs based on OD Type
    function toggleInputs(){
      const odVal = $("odType").value;

      const disableDoctor = (odVal === "SUB") || (odVal === "LRFTU"); // both disable doc
      const disableExams  = (odVal === "SUB") || (odVal === "LRFTU"); // both disable exams
      const disableOD     = (odVal === "EMP") || (odVal === "SUB");   // OD aligned only for LRFTU

      const targets = [
        { id: "doctorHours", disabled: disableDoctor },
        { id: "exams",       disabled: disableExams  },
        { id: "odAlignedHours", disabled: disableOD }
      ];

      targets.forEach(t => {
        const el = $(t.id);
        if (!el) return;
        el.disabled = t.disabled;
        // visual cue
        el.parentElement.classList.toggle("disabled", t.disabled);
        if (t.disabled) el.value = ""; // clear if disabled
      });

      recalc();
    }

    function resetAll(){
      document.querySelectorAll("input").forEach(el => el.value = "");
      $("odType").value = "";
      document.querySelectorAll(".out").forEach(el => el.textContent = "—");
      // remove disabled styles
      ["doctorHours","exams","odAlignedHours"].forEach(id=>{
        const el = $(id);
        if(el){ el.disabled=false; el.parentElement.classList.remove("disabled"); }
      });
    }

    // Wire events
    document.addEventListener("DOMContentLoaded", ()=>{
      // inputs recalc on type
      document.querySelectorAll("input").forEach(el => {
        el.addEventListener("input", recalc);
      });
      $("odType").addEventListener("change", toggleInputs);
      $("calcBtn").addEventListener("click", recalc);
      $("resetBtn").addEventListener("click", resetAll);
    });
  </script>
</body>
</html>
